<body>
    <!-- <app-sidebar class="sidebar"></app-sidebar> -->
    <div class="table">
      <div class="header-content">
        <p>Analyste Liste</p>
      
         <button class="Btn" routerLink="/CreateAnalyste">Add
          <i class='bx bx-plus'></i>
        </button>
    
      </div>
      <div class="table-section">
          <table>
           <thead class="table-header">
              <tr>
                  <th> ID</th>
                  <th>Analyste Name</th>
                  <th> Email</th>
                  <th> Password</th>
                  <th>Role</th>
                  <th>Actions</th>
              </tr>
           </thead>
           <tbody class="table-body">
            <tr *ngFor = "let analyste of analyste"  >
                  <td>{{analyste.id}}</td>
                  <td>{{analyste.username}} </td>
                  <td>{{analyste.email}}</td>
                  <td>{{analyste.password}}</td>
                  <td>Analyste</td>

  
                  <td class="btn-action">
                    <i class="bx bx-edit" ></i>
                    <i
                      class="bx bxs-trash-alt"
                      
                    ></i>
                    <i class="bx bx-show" ></i>
                  </td>
              </tr> 
           </tbody>
          </table>
      </div>

        <div><i class='bx bx-chevron-left'></i></div>
        <div class="page-number">1</div>
        <div class="page-number">2</div>
        <div class="page-number">3</div>
        <div class="page-number">...</div>
        <div><i class='bx bx-chevron-right'></i></div>
      </div> -->
    </div>
  </body>
