<section class="container">
    <header>Add Analyste</header>
    <form class="form" (ngSubmit)="onSubmit()">
      <!-- <form class="form" #incidentForm="ngForm" (ngSubmit)="createIncident(incidentForm)"> -->
        
      <div class="column">
        <div class="input-box">
            <label for="Analyste Name">Analyste Name</label>
            <i class="bx bxs-user"></i>
            <input required="" placeholder="Enter Analyste Name"  type="Analyste Name"
            name="Analyste Name"[(ngModel)]="analyste.username">
          </div>
        <!-- <div class="input-box">
            <label for="lastname">Last name</label>
          <i class="bx bxs-user"></i>
            <input required="" placeholder="Enter Last Name"  type="Last Name"
            name="Last Name">
          </div> -->
      </div>
        <div class="column">
            <div class="input-box">
              <label for="email">Email</label>
              <i class="bx bxs-envelope"></i>
              <input required="" placeholder="Enter Email"  type="Email"
              name="Email"[(ngModel)]="analyste.email">
            </div>
            <div class="input-box">
                <label for="password">Password</label>
                <i class="bx bxs-lock-alt"></i>
                <input required="" placeholder="Enter Password"  type="Password"
                name="Password" [(ngModel)]="analyste.password">
                
              </div>
        </div>
      
    
     
        <div class="input-box address">
          <div class="column">
            <div class="input-box">
              <label>Role</label>
              <i class='bx bxs-universal-access'></i>
              <div class="select-box">
                <select 
                name="Role">
                  <option hidden="" >Role</option>
                  <option value="1">Admin</option>
                  <option value="2">Analyste</option>
                  <option value="3">consulteur</option>
               
                </select>
              </div>
            </div> 
        </div>
        </div>
        <div class="footer-container">
            <button type="submit" class="Btn btn-1">Create</button>
          </div>
     
        
  
  
    
    
      
   
    </form>
  </section>
