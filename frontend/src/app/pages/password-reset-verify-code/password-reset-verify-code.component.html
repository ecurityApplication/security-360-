<div clas="body">
  <div class="verifyContainer">
    <div class="wrapper">
      <span class="bg-animate"></span>
      <span class="bg-animate2"></span>
  
      <div class="form-box forgetPassword">
        <h2>Verify Email</h2>
        <p>We have sent an email verification code. <br>Please enter the code to verify your email</p>
        <form (ngSubmit)="sendVerificationCode()">
          <div class="input-box">
            <input type="text" required [(ngModel)]="otpcode" name="  otpcode"/>
            <label>Enter OTP</label>
            <i class='bx bxs-key'></i>
          </div>
          <div class="btn-login-forgetPassword">
            <button
            type="submit"
              class="btn btn-primary"
              data-bs-toggle="modal"
              data-bs-target="#staticBackdrop"
            >
              Verify
            </button>
          </div>
          <div class="logreg-link">
            <p>
              Nevermind! Take me Back to  <a routerLink="/login" class="login-link"
                >Login</a
              >
            </p>
          </div>
        </form>
      </div>
      <div class="info-text forgetPassword">
        <img class="animation" src="./assets/coficab.png" alt="Company Logo" />
        <p class="animation">Welcome Back!</p>
      </div>
    </div>
  </div>
  </div>
