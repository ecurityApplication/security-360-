

<section class="container" >
  <div class="header-content">
    <h4>Profile</h4>
  </div>
  
    <form class="form" >
      <div class="input-box ">
        <label>Current Password</label>
        <input required=""  placeholder="Current Password"
        type="text"
        [(ngModel)]="resetRequest.currentPassword">
      </div>
      <div class="input-box ">
        <label>New Password</label>
        <input required=""  placeholder="New Password"
        type="text"
        [(ngModel)]="resetRequest.newPassword">
      </div>
      <div class="input-box ">
        <label>Confirm Password</label>
        <input required="" placeholder="Confirm  Password"
        type="text"
        [(ngModel)]="resetRequest.confirmationPassword"
       >
      </div>
      <div class="footer-container">
        <button (click)="changePassword()" class="Btn btn-1">Change Password</button>
      </div>
  </form>
</section>
