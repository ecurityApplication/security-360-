<section class="container">
  <header>Update escalation</header>
  <form class="form" (ngSubmit)="onSubmit()">
    <div class="input-box address">
      <div class="form-group">
        <label for="exampleFormControlTextarea1">Functional Escalation</label>
        <textarea
          id="functionalEscalation"
          rows="3"
          [(ngModel)]="incident.functionalEscalation"
          name="functionalEscalation"
        ></textarea>
      </div>
      <div class="form-group">
        <label for="exampleFormControlTextarea1">Herarachic escalation</label>
        <textarea
          id="herarachicescalation"
          rows="3"
          [(ngModel)]="incident.herarachicescalation"
          name="herarachicescalation"
        ></textarea>
      </div>
      <div class="form-group">
        <label for="exampleFormControlTextarea1">Management escalation</label>
        <textarea
          id="managementescalation"
          rows="3"
          [(ngModel)]="incident.managementescalation"
          name="managementescalation"
        ></textarea>
      </div>
      <div class="form-group">
        <label for="exampleFormControlTextarea1">Resolution and recovery</label>
        <textarea
          id="resolutionandrecovery"
          rows="3"
          [(ngModel)]="incident.resolutionandrecovery"
          name="resolutionandrecovery"
        ></textarea>
      </div>
      <div class="form-group">
        <label for="exampleFormControlTextarea1">Lesson Leraned</label>
        <textarea
          id="lessonLeraned"
          rows="3"
          [(ngModel)]="incident.lessonLeraned"
          name="lessonLeraned"
        ></textarea>
      </div>
      <div class="footer-container">
        <button type="submit" class="Btn btn-1">Add</button>
      </div>
    </div>
  </form>
</section>
