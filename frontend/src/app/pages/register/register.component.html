<body>
  <div class="wrapper">
    <span class="bg-animate"></span>
    <span class="bg-animate2"></span>
    <div class="form-box register" *ngIf="!authResponse.mfaEnabled">
      <h2>Sign Up</h2>
      <form *ngIf="!isSuccessful" (ngSubmit)="registerUser()">
        <div class="input-box">
          <input
            id="username"
            name="username"
            required
            minlength="3"
            maxlength="20"
            type="text"
            [(ngModel)]="registerRequest.username"
          />
          <label class="input-fieled" for="username">Username</label>
          <i class="bx bxs-user"></i>
        </div>
        <!-- <div class="input-box">
          <input
            id="lastname"
            name="lastname"
            required
            type="text"
            [(ngModel)]="registerRequest.lastname"
          />
          <label for="lastname">Last name</label>
          <i class="bx bxs-user"></i>
        </div> -->
        <div class="input-box">
          <input
            id="email"
            name="email"
            required
            type="text"
            [(ngModel)]="registerRequest.email"
          />
          <label for="email">Email</label>
          <i class="bx bxs-envelope"></i>
        </div>
        <div class="input-box">
          <input
            id="password"
            name="password"
            required
            minlength="6"
            type="password"
            [(ngModel)]="registerRequest.password"
          />
          <label for="password">Password</label>
          <i class="bx bxs-lock-alt"></i>
        </div>

        <!-- mfa -->
        <div class="form-group">
          <div class="toggle-switch">
            <input
              class="toggle-input"
              id="toggle"
              name="rememberMe"
              type="checkbox"
              [(ngModel)]="registerRequest.mfaEnabled"
            />
            <label class="toggle-label" for="toggle"></label>
          </div>
          <label for="rememberMe">Enable 2FA </label>
        </div>
        <button type="submit" class="btn">Sign Up</button>
        <div class="logreg-link">
          <p>
            Already have an acount?<a routerLink="/login" class="login-link"
              >Login</a
            >
          </p>
        </div>
        <div class="alert alert-warning" *ngIf=" isSignUpFailed">
          Signup failed!<br />{{ errorMessage }}
        </div>
      </form>
      <div class="alert alert-success" *ngIf="isSuccessful">
        Your registration is successful!
      </div>
    </div>
    <div class="form-verify container" *ngIf="authResponse.mfaEnabled">
      <!-- <div class="success-message-panel" *ngIf="message">
        <div class="success-icon">&#10004;</div>
        <div class="success-message">{{ message }}</div>
      </div> -->
      <div class="form-verify container">
        <h4 class="towfa-text">Set Up Two-Factor Authentication</h4>
        <div class="qr-code">
          <!-- <img [src]="authResponse.secretImageUri" alt="QR Code" /> -->
        </div>
        <div class="form-group-code">
          <label for="validationCode"
            >Enter 6 digits Validation Code Generated by the app</label
          >
          <!-- <input
            type="text"
            id="validationCode"
            name="validationCode"
            required
            [(ngModel)]="otpCode"
          /> -->
          <div class="password">
            <input
              #input0
              maxlength="1"
              class="input"
              name="text"
              type="text"
              [(ngModel)]="otpCode[0]"
              (ngModelChange)="focusNext(input1)"
            />
            <input
              #input1
              maxlength="1"
              class="input"
              name="text"
              type="text"
              [(ngModel)]="otpCode[1]"
              (ngModelChange)="focusNext(input2)"
            />
            <input
              #input2
              maxlength="1"
              class="input"
              name="text"
              type="text"
              [(ngModel)]="otpCode[2]"
              (ngModelChange)="focusNext(input3)"
            />
            <input
              #input3
              maxlength="1"
              class="input"
              name="text"
              type="text"
              [(ngModel)]="otpCode[3]"
              (ngModelChange)="focusNext(input4)"
            />
            <input
              #input4
              maxlength="1"
              class="input"
              name="text"
              type="text"
              [(ngModel)]="otpCode[4]"
              (ngModelChange)="focusNext(input5)"
            />
            <input
              #input5
              maxlength="1"
              class="input"
              name="text"
              type="text"
              [(ngModel)]="otpCode[5]"
            />
          </div>
          <div class="password-btn">
            <button
              type="button"
              class="password-code-btn"
              (click)="verifyTfa()"
              [class.button-disabled]="otpCode.length < 6"
            >
              Verify code
            </button>
          </div>
        </div>
      </div>
    </div>
    <div class="info-text register">
      <img class="animation" src="./assets/coficab.png" alt="Company Logo" />
      <p class="animation">Welcome Back!</p>
    </div>
  </div>
</body>
