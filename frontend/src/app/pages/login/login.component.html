<!-- <body> -->
  <div class="body">
  <div class="wrapper">
    <span class="bg-animate"></span>
    <span class="bg-animate2"></span>

    <div class="form-box login" *ngIf="!authResponse.mfaEnabled">
      <h2>Login</h2>
      <form   (ngSubmit)="authenticate()">
        <div class="input-box">
          <input
            type="text"
            id="email"
            name="email"
            [(ngModel)]="authRequest.email"
          />
          <label for="email">Email</label>
          <i class="bx bxs-envelope"></i>
        </div>

        <div class="input-box">
          <input
            type="password"
            id="password"
            name="password"
            required
            [(ngModel)]="authRequest.password"
            minlength="6"
          />
          <label for="password">Password</label>
          <i class="bx bxs-lock-alt"></i>
        </div>
        <div class="btn-login-forgotpwd">
          <button type="submit" class="btn">Login</button>
          <a routerLink="/passwordreset" class="forgot-password"
            >Forget password?</a
          >
        </div>
        <div class="logreg-link">
          <p>
            Don't have an acount?<a routerLink="/register" class="register-link"
              >Sign Up</a
            >
          </p>
        </div>
      </form>
    </div>
    <div class="form-verify container" *ngIf="authResponse.mfaEnabled">
      <h2>Two-Factor Authentication</h2>
      <div class="form-group">
        <label for="validationCode"
          >Enter 6 digits Validation <br />
          Code Generated by the app</label
        >
        <div class="password">
          <input
            #input0
            maxlength="1"
            class="input"
            name="text"
            type="text"
            [(ngModel)]="otpCode[0]"
            (ngModelChange)="focusNext(input1)"
          />
          <input
            #input1
            maxlength="1"
            class="input"
            name="text"
            type="text"
            [(ngModel)]="otpCode[1]"
            (ngModelChange)="focusNext(input2)"
          />
          <input
            #input2
            maxlength="1"
            class="input"
            name="text"
            type="text"
            [(ngModel)]="otpCode[2]"
            (ngModelChange)="focusNext(input3)"
          />
          <input
            #input3
            maxlength="1"
            class="input"
            name="text"
            type="text"
            [(ngModel)]="otpCode[3]"
            (ngModelChange)="focusNext(input4)"
          />
          <input
            #input4
            maxlength="1"
            class="input"
            name="text"
            type="text"
            [(ngModel)]="otpCode[4]"
            (ngModelChange)="focusNext(input5)"
          />
          <input
            #input5
            maxlength="1"
            class="input"
            name="text"
            type="text"
            [(ngModel)]="otpCode[5]"
          />
        </div>
      </div>
      <button
        type="button"
        class="password-code-btn"
        (click)="verifyCode()"
        [class.button-disabled]="otpCode.length < 6"
      >
        Verify code
      </button>
    </div>
    <div class="info-text login">
      <img class="animation" src="./assets/coficab.png" alt="Company Logo" />

      <p class="animation">Welcome Back!</p>
    </div>
  </div>
</div>
