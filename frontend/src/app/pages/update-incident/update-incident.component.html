<div class="row">
  <div class="card col-md-6 offset-md-3 offset-md-3">
    <div class="row">
      <h3 class="text-center"> Update Incident </h3>
      <hr />
      <div class="card-body">
        <form (ngSubmit)="onSubmit()">

          <div class="form-group">
            <label> incidentType</label>
        <select class="form-control" aria-label="Default select example" [ngModel]="incident.incidentType"
        name="incidentType">
            <option selected> </option>
            <option value="1">Major incident</option>
            <option value="2">Minor Incident</option>
          </select>
          </div>
      
        <div class="form-group">
            <label> date</label>
            <input type="date" class="form-control" id="date" [(ngModel)]="incident.date"
                name="date">
        </div>
        <div class="form-group">
            <label> title</label>
            <input type="text" class="form-control" id="title" [(ngModel)]="incident.title"
                name="title">
        </div>
        <div class="form-group">
            <label> severityLevel</label>
        <select class="form-control" aria-label="Default select example" [ngModel]="incident.severityLevel"
        name="severityLevel">
            <option selected> </option>
            <option value="1">Informational</option>
            <option value="2">Low</option>
            <option value="2">Medium</option>
            <option value="2">High</option>
            <option value="2">Critical</option>
          </select>
          </div>
          <div class="form-group">
            <label> category</label>
        <select class="form-control" aria-label="Default select example" [ngModel]="incident.category"
        name="category">
            <option selected> </option>
            <option value="1">Application</option>
            <option value="2">Email</option>
            
          </select>
          </div>
          <div class="form-group">
            <label>  incidentID</label>
            <input type="text" class="form-control" id="incidentID" [(ngModel)]="incident.incidentID"
                name="incidentID">
        </div>
          <div class="form-group">
            <label> ticketRaised</label>
        <select class="form-control" aria-label="Default select example" [ngModel]="incident.ticketRaised"
        name="ticketRaised">
            <option selected> </option>
            <option value="1">Yes</option>
            <option value="2">No</option>
            
          </select>
          </div>
          <div class="form-group">
            <label> plantName</label>
        <select class="form-control" aria-label="Default select example" [ngModel]="incident.plantName"
        name="plantName">
            <option selected> </option>
            <option value="1">COFMA</option>
            <option value="2">COFKT</option>
            <option value="3">COFMD</option>
            <option value="4">COFTN</option>
            <option value="5">COFSHA</option>
            <option value="6">COFTJ</option>
            <option value="7">COFTT</option>
            <option value="8">COFDE</option>
            <option value="9">COFGR</option>
            <option value="10">COFPT</option>
            <option value="11">COFCJ</option>
            <option value="12">COFHN</option>
            <option value="13">COFLE</option>
            <option value="14">COFMT</option>
            <option value="15">COFMX</option>
            <option value="16">COFUS</option>
            <option value="17">COFEE</option>
            <option value="18">COFMK</option>
            <option value="19">COFPL</option>
            <option value="20">CHAKIRA</option>
            <option value="21">COFRS</option>
            <option value="22">CORPORATE</option>

          </select>
          </div>
          <div class="form-group">
            <label> raisedBy</label>
        <select class="form-control" aria-label="Default select example" [ngModel]="incident.raisedBy"
        name="raisedBy">
            <option selected> </option>
            <option value="1">Crowdstrike</option>
            <option value="2">Proofpoint</option>
            <option value="3">Siem</option>
            <option value="4">FortiAnalyser</option>
            <option value="5">MicrosoftDefender</option>
            <option value="6">Azure</option>
            
          </select>
          </div>
          <div class="form-group">
            <label> hostName </label>
            <input type="text" class="form-control" id="hostName" [(ngModel)]="incident.hostName"
                name="hostName">
        </div>
        <div class="form-group">
            <label> userName </label>
            <input type="text" class="form-control" id="userName" [(ngModel)]="incident.userName"
                name="userName">
        </div>
          <div class="form-group">
            <label> hostStatus</label>
        <select class="form-control" aria-label="Default select example" [ngModel]="incident.hostStatus"
        name="hostStatus">
            <option selected> </option>
            <option value="1">Contained</option>
            <option value="2">NOT-Contained</option>
          </select>
          </div>
          <div class="form-group">
            <label> investigation </label>
            <input type="text" class="form-control" id="userName" [(ngModel)]="incident.investigation"
                name="investigation">
        </div>
        <div class="form-group">
            <label> remediation </label>
            <input type="text" class="form-control" id="userName" [(ngModel)]="incident.remediation"
                name="remediation">
        </div>
        <div class="form-group">
            <label> firstEvent </label>
            <input type="text" class="form-control" id="userName" [(ngModel)]="incident.firstEvent"
                name="firstEvent">
        </div>
        <div class="form-group">
            <label> acknowledge </label>
            <input type="text" class="form-control" id="userName" [(ngModel)]="incident.acknowledge"
                name="acknowledge">
        </div>
        <div class="form-group">
            <label> timeAnalyse </label>
            <input type="number" class="form-control" id="userName" [(ngModel)]="incident.timeAnalyse"
                name="timeAnalyse">
        </div>
        <div class="form-group">
            <label> analyst </label>
            <input type="text" class="form-control" id="userName" [(ngModel)]="incident.analyst"
                name="analyst">
        </div>
        <div class="form-group">
            <label> remediationOwner </label>
            <input type="text" class="form-control" id="userName" [(ngModel)]="incident.remediationOwner"
                name="remediationOwner">
        </div>
        <div class="form-group">
            <label> dateTarget </label>
            <input type="date" class="form-control" id="userName" [(ngModel)]="incident.dateTarget"
                name="dateTarget">
        </div>


          <div class="form-group">
            <label> escalation</label>
        <select class="form-control" aria-label="Default select example" [ngModel]="incident.escalation"
        name="escalation">
            <option selected> </option>
            <option value="1">Yes</option>
            <option value="2">No</option>
            
          </select>
          </div>
          <div class="form-group">
            <label> incidentStatus</label>
        <select class="form-control" aria-label="Default select example" [ngModel]="incident.incidentStatus"
        name="incidentStatus">
            <option selected> </option>
            <option value="1">Open</option>
            <option value="2">Closed</option>
            
          </select>
          </div>
          <div class="form-group">
            <label> falsePositive</label>
        <select class="form-control" aria-label="Default select example" [ngModel]="incident.falsePositive"
        name="falsePositive">
            <option selected> </option>
            <option value="1">Yes</option>
            <option value="2">No</option>
            
          </select>
          </div>
        

          <br />
          <button class="btn btn-success" type="submit">Submit</button>


        </form>
      </div>
    </div>
  </div>
</div>
