<div class="sidenav" [ngClass]="collapsed ? 'sidenav-collapsed': ''">
  <div class="top-nav">
    <div *ngIf="collapsed" class="logo-details-img">
      <img class="logo_name" src="/assets/coficab.png" />
    </div>
  <div class="logo-details">
      <i class="bx bx-menu" id="btn" (click)="toggleCollapse()"></i>
      
    </div>
  </div>
<ul class="sidenav-nav">
    <li class="sidenav-nav-item" *ngFor="let data of navData; let i = index"  [ngClass]="{'selected': selectedItem === i}" (click)="selectItem(i)">
        <a class="sidenav-nav-link" [routerLink]="[data.routeLink]" 
            routerLinkActive="active"
            [routerLinkActiveOptions]="{exact: true}"
        >
            <i class="sidenav-link-icon" [class]="data.icon"></i>
            <span class="sidenav-link-text" @fadeInOut *ngIf="collapsed">
                {{data.label}}
            </span>
           
        </a>
    </li>
    <hr />
    <div class="sidbar-footer" (click)="logout()">
      <li   >
        <a >
          <i class="bx bx-log-out" ></i>
          <span class="sidenav-link-text" @fadeInOut *ngIf="collapsed">Logout</span>
        </a>
       
      </li>
    </div>
</ul>

</div>
