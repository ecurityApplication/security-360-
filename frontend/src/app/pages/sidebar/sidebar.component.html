
  <div class="sidebar" [ngClass]="{ open: sidebarOpen }">

    </div>
    <ul class="nav-list">
      <li routerLink="/incidentlogging">
        <a>
          <i class="bx bx-grid-alt"></i>
          <span class="links_name">Incident Logging</span>

        <span class="tooltip">Incident Logging</span>
      </li>
      <li>
        <span class="tooltip">Incident report</span>
      </li>
      <li routerLink="/escalation">
        <a>
          <i class="bx bx-table"></i>
          <span class="links_name">Escalation</span>
        </a>
        <span class="tooltip">Escalation</span>
      </li>
      <li>
        <a>
          <i class="bx bx-pie-chart-alt-2"></i>
          <span class="links_name">Analytics</span>
        </a>
        <span class="tooltip">Analytics</span>
      </li>
      <li>
        <a>
          <i class="bx bxs-bar-chart-alt-2"></i>
          <span class="links_name">Monthly KPIs</span>
        </a>
        <span class="tooltip">Monthly KPIs</span>
      </li>
      <li>
        <a>
          <i class="bx bx-line-chart"></i>
          <span class="links_name">Yearly KPIs</span>
        </a>
        <span class="tooltip">Yearly KPIs</span>
      </li>
      <li routerLink="/calendar">
        <a>
          <i class="bx bx-calendar"></i>
          <span class="links_name">Calendar</span>
        </a>
        <span class="tooltip">Calendar</span>
      </li>
      <li routerLink="/profile">
        <a>
          <i class='bx bx-cog'></i>
          <span class="links_name">Profile</span>
        </a>
        <span class="tooltip">Profile</span>
      </li>
      <li routerLink="/userList">
        <a>
          <i class="bx bx-user"></i>
          <span class="links_name">Users List</span>
        </a>
        <span class="tooltip">Users List</span>
      </li>
      <li routerLink="/roleUser">
        <a>
          <i class='bx bx-check-shield'></i>
          <span class="links_name">Roles</span>
        </a>
        <span class="tooltip">Roles</span>
      </li>

      
      <hr />
      <div class="sidbar-footer">
        <li (click)="logout()">
          <a>
            <i class="bx bx-log-out"></i>
            <span class="links_name">Logout</span>
          </a>
          <span class="tooltip">Logout</span>
        </li>
      </div>
