<section class="container">
  <header>Add User</header>
  <form class="form" (ngSubmit)="onSubmit()">
    <!-- <form class="form" #incidentForm="ngForm" (ngSubmit)="createIncident(incidentForm)"> -->
    <div class="column">
      <div class="input-box">
        <label for="Username">Username</label>
       
        <input
          required=""
          placeholder="Enter Username"
          type="Username"
          name="Username"
          [(ngModel)]="user.username"
        />
      </div>
    </div>
    <div class="column">
      <div class="input-box">
        <label for="email">Email</label>
        <input
          required=""
          placeholder="Enter Email"
          type="Email"
          name="Email"
          [(ngModel)]="user.email"
        />
      </div>
      <div class="input-box">
        <label for="password">Password</label>
        <input
          required=""
          placeholder="Enter Password"
          type="Password"
          name="Password"
          [(ngModel)]="user.password"
        />
      </div>
    </div>
    <div class="input-box address">
      <div class="column">
        <div class="input-box">
          <label>Role</label>
          <div class="select-box"  [(ngModel)]="user.role">
            <select name="Role">
              <option hidden="">Role</option>
              <option value="1">Admin</option>
              <option value="2">Analyste</option>
              <option value="3">Consulteur</option>
            </select>
          </div>
        </div>
      </div>
    </div>
    <div class="footer-container">
      <button type="submit" class="Btn btn-1">Create</button>
    </div>
  </form>
</section>
