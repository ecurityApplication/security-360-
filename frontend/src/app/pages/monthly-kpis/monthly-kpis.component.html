<div class="container">
  <div class="header-content">
    <h4>Soc Monthly KPI</h4>
  </div>
  <div class="content-card">
    <div class="row">
       <!-- MTTA -->
        <div class="col-md-4 col-xl-3">
            <div class="card bg-c-blue order-card">
                <div class="card-block">
                    <h6 class="m-b-20">Current Month Incident Count</h6>
                    <h2 class="text-right"><i class="fa fa-cart-plus f-left"></i><span>{{ incidentsCount }}</span></h2>
                    
                </div>
            </div>
        </div>
         <!-- Number of Incidents This month  -->
        <div class="col-md-4 col-xl-3">
            <div class="card bg-c-green order-card">
                <div class="card-block">
                    <h6 class="m-b-20">MTTA </h6>
                    <h2 class="text-right"><i class="fa fa-rocket f-left"></i><span>{{ averageTimeAnalyse }}</span></h2>
                    <p class="m-b-0">Target<span class="f-right">60 min</span></p>
                </div>
            </div>
        </div>
        <!-- MTTR -->
        <div class="col-md-4 col-xl-3">
            <div class="card bg-c-yellow order-card">
                <div class="card-block">
                    <h6 class="m-b-20">MTTR</h6>
                    <h2 class="text-right"><i class="fa fa-refresh f-left"></i><span>{{ averageMttr }}</span></h2>
                    <p class="m-b-0">Target<span class="f-right"></span></p>
                </div>
            </div>
        </div>
        <!-- FPR -->
        <div class="col-md-4 col-xl-3">
            <div class="card bg-c-pink order-card">
                <div class="card-block">
                    <h6 class="m-b-20">FPR</h6>
                    <h2 class="text-right"><i class="fa fa-credit-card f-left"></i><span>{{ falsePositiveRating }} %</span></h2>
                    <p class="m-b-0">Target<span class="f-right">45%</span></p>
                </div>
            </div>
        </div>
	</div>
</div>

  <div class="charts">
    <!-- events-per-analyst -->
    <img class="img-coficab" src="../../../assets/coficab_img.jpg" />
  </div>
  <!-- events-per-analyst -->
  <div class="content">
    <!-- Number of alerts per plant -->
    <div class="chart" id="incident-count-by-plant-and-month-chart"></div>
    <!-- Tickets raised/incidents -->
    <div class="chart" id="chartContainer" style="height: 400px;"></div>

    
    <!-- <div class="chart" id="tickets-raised-per-month-chart"></div>   -->
    <!-- <div class="chart" id="incident-chart-ticket-raised" ></div> -->
    <div class="chart" id="incident-chart-severity" ></div>
    <div class="chart" id="incident-count-by-analyst"></div>


  </div>
  
      
    <div class="charts-bottom">
      <!-- Number of events per analyst monthly  -->
  

  </div>
  <!-- Number of Incidents This month  -->

  <!-- <div style="width: 100%; height: 100%;margin: 0 auto;">
    <canvas id="incidentChart"></canvas>
  </div> -->
  </div>
</div>
