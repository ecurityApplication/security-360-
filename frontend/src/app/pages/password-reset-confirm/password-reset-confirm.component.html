<div clas="body">
  <div class="resetConfirmContainer">
  <div class="wrapper">
    <span class="bg-animate"></span>
    <span class="bg-animate2"></span>

    <div class="form-box forgetPassword">
      <h2>Change Password</h2>
      <p>
        Your new password must be different from previous used passwords.


      </p>
      <form  (ngSubmit)="sendVerificationCode()">
        <div class="input-box">
          <input type="password" required  [(ngModel)]="newPassword"name="newpassword"/>
          <label>New Password</label>
          <i class="bx bxs-lock-alt"></i>
        </div>
        <div class="input-box">
          <input type="password" required  [(ngModel)]="confirmationPassword"name="confirmationPassword"/>
          <label>Confirm Password</label>
          <i class="bx bxs-lock-alt"></i>
        </div>
       
        <div class="btn-login-forgetPassword">
          <button type="submit"
          
            class="btn btn-primary"
            data-bs-toggle="modal"
            data-bs-target="#staticBackdrop"
          >
            Reset Password
          </button>
        </div>
        <div class="logreg-link">
          <p>
            Return to  <a routerLink="/login" class="login-link"
              >Login</a
            >
          </p>
        </div>
      </form>
    </div>
    <div class="info-text forgetPassword">
      <img class="animation" src="./assets/coficab.png" alt="Company Logo" />
      <p class="animation">Welcome Back!</p>
    </div>
  </div>
  </div>
</div>
