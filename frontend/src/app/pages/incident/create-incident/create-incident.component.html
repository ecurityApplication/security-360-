<script src="../../frontEnd_Security/src/models/incident-model.ts"></script><h3>Create Incident</h3>
<div  [hidden]="submitted" style="width: 400px;">
  <form (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="name">Title</label>
      <input type="text" class="form-control" id="name" required [(ngModel)]="incident.title" name="name">
    </div>
    <div class="form-group">
      <label for="name">HostName</label>
      <input type="text" class="form-control" id="email" required [(ngModel)]="incident.Host_Name" name="email">
    </div>

    <div class="form-group">
      <label for="name">Time_Analyse</label>
      <input type="text" class="form-control" id="phone" required [(ngModel)]="incident.Time_Analyse" name="phone">
    </div>
    <div class="form-group">
      <label for="name">User_Name</label>
      <input type="text" class="form-control" id="department" required [(ngModel)]="incident.User_Name" name="department">
    </div>

    <button class="btn btn-success">Submit</button>
  </form>
</div>
