<div class="container">
  <!-- First Highcharts chart -->
  <div class="first-chart" style="margin-right: 40px;">
    <highcharts-chart
      [Highcharts]="Highcharts"
      [options]="chartOptions"
      [oneToOne]="oneToOne"
      [(update)]="updateFlag"
    ></highcharts-chart>
  </div>

  <!-- Second Highcharts chart -->
  <div class="second-chart">
    <highcharts-chart
      [Highcharts]="Highcharts"
      [options]="secondChartOptions"
      [oneToOne]="oneToOne"
      [(update)]="updateFlag"
    ></highcharts-chart>
  </div>
</div>
