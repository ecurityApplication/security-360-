<section class="container">
    <div class="div">
        <mat-dialog-actions>
        <div class="mdiv" >
          <div class="md" >
          </div>
        </div>
    </mat-dialog-actions>
      </div>
    <header>Add new Role</header>
    <form class="form" (ngSubmit)="onSubmit()">
      <!-- <form class="form" #incidentForm="ngForm" (ngSubmit)="createIncident(incidentForm)"> -->
      <div class="column">
        <div class="input-box">
          <input
            required=""
            placeholder="Enter Role Name"
            type="roleName"
            name="roleName"
            [(ngModel)]="role.roleName"
          />
        </div>
      </div>
      <div class="footer-container">
        <button type="submit" class="Btn btn-1">Create</button>
      </div>
    </form>
  </section>
