<body>
  <div class="wrapper">
    <span class="bg-animate"></span>
    <span class="bg-animate2"></span>

    <div class="form-box forgetPassword">
      <h2>Password Reset</h2>
      <p>
        To reset your password, enter the email address you use to sign in to
        COFICAB
      </p>
      <form>
        <div class="input-box">
          <input type="text" required />
          <label>Email</label>
          <i class="bx bxs-envelope"></i>
        </div>
        <div class="btn-login-forgetPassword">
          <button
            type="submit"
            class="btn btn-primary"
            data-bs-toggle="modal"
            data-bs-target="#staticBackdrop"
          >
            Login
          </button>
        </div>
      </form>
    </div>
    <div class="info-text forgetPassword">
      <img class="animation" src="./assets/coficab.png" alt="Company Logo" />
      <p class="animation">Welcome Back!</p>
    </div>
  </div>
  <!-- Modal -->
  <div
    class="modal fade"
    id="staticBackdrop"
    data-bs-backdrop="static"
    data-bs-keyboard="false"
    tabindex="-1"
    aria-labelledby="staticBackdropLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-body">
          <div class="modal-header">
            <h4 >Send Reset Link</h4>
            <!-- <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button> -->
          </div>
          <p>Password link sent Please check your email</p>
          <!-- <span>email</span> -->
        </div>
        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-secondary"
            data-bs-dismiss="modal"
          >
            Close
          </button>
        </div>
      </div>
    </div>
  </div>
</body>
