<h2> Employee List</h2>
<table class = "table table-striped table-bordered">
    <thead>
        <tr>
            <th>id</th>
            <th>title </th>
            <th>incidentID</th>
            <th>hostName</th>
            <th>userName</th>
            <th> Actions </th>
        </tr>
    </thead>
        <tbody>
            <tr *ngFor = "let incident of incidents" >
                <td> {{ incident.id }} </td>
                <td> {{ incident.title }} </td>
                <td> {{ incident.incidentID }} </td>
                <td> {{ incident.hostName }} </td>
                <td> {{ incident.userName }} </td>
                <td>
                  <button (click) = "updateIncident(incident.id)" class = "btn btn-primary"> Update</button>
                  <button (click) = "deleteIncident(incident.id)" class = "btn btn-danger" style="margin-left: 10px"> Delete</button>
                  <button (click) = "incidentDetails(incident.id)" class = "btn btn-info" style="margin-left: 10px">View</button>
                </td>

            </tr>

            </tbody>

    </table>
