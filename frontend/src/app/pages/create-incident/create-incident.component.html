<section class="container">
  <header>Add Incident</header>
  <form class="form"(ngSubmit)="onSubmit()">
    <div class="input-box">
      <label>Incident ID</label>
      <input required="" placeholder="Enter ID" type="text" id="incidentID" [(ngModel)]="incident.incidentID"
name="incidentID"/>
    </div>
    <div class="column">
      <div class="input-box">
        <label> Incident Type</label>
        <div class="select-box">
          <select [(ngModel)]="incident.incidentType"
          name="incidentType">
            <option hidden >Incident Type</option>
            <option value="Major incident">Major incident</option>
            <option value="Minor Incident">Minor Incident</option>
          </select>
        </div>
      </div>
      <div class="input-box">
        <label>Date</label>
        <input required="" placeholder="Enter Date" type="date" [(ngModel)]="incident.date"
        name="date">
      </div>
    </div>
      <div class="column">
          <div class="input-box">
            <label> Title</label>
            <input required="" placeholder="Enter Title"  type="text" [(ngModel)]="incident.title"
            name="title">
          </div>
          <div class="input-box">
            <label>Severity Level</label>
            <div class="select-box">
              <select [(ngModel)]="incident.severityLevel"
              name="severityLevel">
                <option hidden="" >Severity Level</option>
                <option value="Informational">Informational</option>
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="High">High</option>
                <option value="Critical">Critical</option>
              </select>
            </div>
          </div>
      </div>
      <div class="gender-box">
        <label>Category</label>
        <div class="gender-option">
          <div class="gender">
            <input  [(ngModel)]="incident.category" 
            name="category"     id="check-application" type="radio">
            <label for="check-application">Application</label>
          </div>
          <div class="gender">
            <input  [(ngModel)]="incident.category" 
            name="category" value="Email" id="check-email" type="radio">
            <label for="check-email">Email</label>
          </div>
        </div>
      </div>
      <div class="gender-box">
        <label>Ticket Raised</label>
        <div class="gender-option">
          <div class="gender">
            <input   [(ngModel)]="incident.ticketRaised"
            name="Yes"  id="Yes" type="radio">
            <label for="Yes">Yes</label>
          </div>
          <div class="gender">
            <input  [(ngModel)]="incident.ticketRaised"
            name="No" value="No" id="No" type="radio">
            <label for="No">No</label>
          </div>
          
        </div>
      </div>
      <div class="input-box address">
        <div class="column">
          <div class="input-box">
            <label>PlantName</label>
            <div class="select-box">
              <select [(ngModel)]="incident.plantName"
              name="plantName">
                <option hidden="" >PlantName</option>
                <option value="COFMA">COFMA</option>
                <option value="COFKT">COFKT</option>
                <option value="COFMD">COFMD</option>
                <option value="COFTN">COFTN</option>
                <option value="COFSHA">COFSHA</option>
                <option value="COFTJ">COFTJ</option>
                <option value="COFTT">COFTT</option>
                <option value="COFDE">COFDE</option>
                <option value="COFGR">COFGR</option>
                <option value="COFPT">COFPT</option>
                <option value="COFCJ">COFCJ</option>
                <option value="COFHN">COFHN</option>
                <option value="COFLE">COFLE</option>
                <option value="COFMT">COFMT</option>
                <option value="COFMX">COFMX</option>
                <option value="COFUS">COFUS</option>
                <option value="COFEE">COFEE</option>
                <option value="COFMK">COFMK</option>
                <option value="COFPL">COFPL</option>
                <option value="CHAKIRA">CHAKIRA</option>
                <option value="COFRS">COFRS</option>
                <option value="CORPORATE">CORPORATE</option>
              </select>
            </div>
          </div>
          <div class="input-box">
            <label>Raised By</label>
            <div class="select-box">
              <select [(ngModel)]="incident.raisedBy"
              name="raisedBy">
                <option hidden="" >Raised By</option>
                <option value="Crowdstrike">Crowdstrike</option>
                <option value="Proofpoint">Proofpoint</option>
                <option value="Siem">Siem</option>
                <option value="FortiAnalyser">FortiAnalyser</option>
                <option value="MicrosoftDefender">MicrosoftDefender</option>
                <option value="Azure">Azure</option>
                <option value="whatsAppGold">whatsAppGold</option>
              </select>
            </div>
          </div> 
      </div>
      <div class="column">
        <div class="input-box">
          <label>HostName</label>
        <input required="" placeholder="Enter The Host Name" type="text" id="hostName" [(ngModel)]="incident.hostName"
        name="hostName">
        </div>
        <div class="input-box">
          <label>UserName</label>
        <input required="" placeholder="Enter The UserName" type="text"  id="userName" [(ngModel)]="incident.userName"
        name="userName">
        </div>
      </div>
      <div class="input-box">
        <label>Host Status</label>
        <div class="select-box">
          <select [(ngModel)]="incident.hostStatus"
          name="hostStatus">
            <option hidden="" >Host Status</option>
            <option value="Contained">Contained</option>
            <option value="NOT-Contained">NOT-Contained</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label for="exampleFormControlTextarea1">Investigation</label>
        <textarea  id="investigation"  rows="3"  [(ngModel)]="incident.investigation" name="investigation" ></textarea>
      </div>

      <div class="form-group">
      <input 
                           type="file"
                           #selectFile
                           multiple value="select"
                           (change)="onFileSelected($event)">
      </div>

      <div class="form-group">
        <label for="exampleFormControlTextarea1">Remediation</label>
        <textarea  id="remediation"  rows="3"  [(ngModel)]="incident.remediation" name="remediation" ></textarea>
      </div>
      <div class="column">
       <div class="input-box">
        <label>First Event</label>
        <input required="" placeholder="Enter The First Event" type="text" id="firstEvent" [(ngModel)]="incident.firstEvent"
        name="firstEvent">
       </div>
       <div class="input-box">
        <label>Acknowledge</label>
        <input required="" placeholder="Enter The Acknowledge" type="text" id="acknowledge" [(ngModel)]="incident.acknowledge"
        name="acknowledge">
       </div>
      </div>
      <div class="column">
       <div class="input-box">
        <label>Time To Analyse</label>
        <input required="" placeholder="Enter The Time" type="number" id="timeAnalyse" [(ngModel)]="incident.timeAnalyse"
        name="timeAnalyse" step="5">
       </div>
       <div class="input-box">
        <label>Analyst</label>
        <div class="select-box">
          <select [(ngModel)]="incident.analyst"
          name="analyst">
            <option hidden="" >Analyst</option>
            <option value="Oussema DOUGGUI">Oussema DOUGGUI</option>
            <option value="Amal BELAID">Amal BELAID</option>
            <option value="Souhail DAKHLAOUI">Souhail DAKHLAOUI</option>
            <option value="Rami MANSOURI">Rami MANSOURI</option>
          </select>
        </div>
      </div> 
      </div>
        <label>Reviewer</label>
        <input required="" id="Reviewer" [(ngModel)]="incident.reviewer"
        name="Reviewer">
        <div class="column">
<div class="input-box">
  <label>Remediation Owner</label>
  <div class="select-box">
    <select [(ngModel)]="incident.remediationOwner"
    name="remediationOwner">
    <option value="COFMA">COFMA</option>
    <option value="COFKT">COFKT</option>
    <option value="COFMD">COFMD</option>
    <option value="COFTN">COFTN</option>
    <option value="COFSHA">COFSHA</option>
    <option value="COFTJ">COFTJ</option>
    <option value="COFTT">COFTT</option>
    <option value="COFDE">COFDE</option>
    <option value="COFGR">COFGR</option>
    <option value="COFPT">COFPT</option>
    <option value="COFCJ">COFCJ</option>
    <option value="COFHN">COFHN</option>
    <option value="COFLE">COFLE</option>
    <option value="COFMT">COFMT</option>
    <option value="COFMX">COFMX</option>
    <option value="COFUS">COFUS</option>
    <option value="COFEE">COFEE</option>
    <option value="COFMK">COFMK</option>
    <option value="COFPL">COFPL</option>
    <option value="CHAKIRA">CHAKIRA</option>
    <option value="COFRS">COFRS</option>
    <option value="CORPORATE">CORPORATE</option>
    </select>
  </div>
</div>
<div class="input-box">
  <label>Date Target</label>
  <input required="" type="date" id="dateTarget" [(ngModel)]="incident.dateTarget"
  name="dateTarget">
</div>
<div class="input-box">
  <label>Escalation</label>
  <div class="select-box">
    <select [(ngModel)]="incident.escalation"
    name="escalation">
      <option hidden="" >Escalation</option>
      <option value="Yes">Yes</option>
      <option value="No">No</option>
    </select>
  </div>
</div> 
        </div>
        <div class="column">
          <div class="input-box">
            <label>Incident Status</label>
            <div class="select-box">
              <select [(ngModel)]="incident.incidentStatus"
              name="incidentStatus">
                <option hidden="" >Incident Status</option>
                <option value="Open">Open</option>
                <option value="Closed">Closed</option>
              </select>
            </div>
          </div>
          <div class="input-box">
            <label>False Positive</label>
            <div class="select-box">
              <select [(ngModel)]="incident.falsePositive"
              name="falsePositive">
                <option hidden="" >False Positive</option>
                <option value="Yes">Yes</option>
                <option value="No">No</option>
              </select>
            </div>
          </div>
        </div>
      </div>
      <div class="footer-container">
        <button type="submit" class="Btn btn-1">Create</button>
      </div>
  </form>
</section>
