<div class="main-content" app-navbar>
  <main>
    <div class="page-content">
      <p>Roles Liste</p>
      <div class="analytics">
        <div class="cards-role">
          <div class="card" *ngFor="let role of userCountPerRole | keyvalue">
            <div class="card-head">
              <i class="bx bxs-group"></i>
              <h2>{{ role.key }}</h2>
              <span class="las la-user-friends"></span>
            </div>
            <div class="card-progress">
              <small>Total users: {{ role.value }}</small>
              <div class="card-indicator"></div>
            </div>
          </div>
        </div>
        <button
          class="Btn"
          mat-button
          color="primary"
          (click)="openCreaterole()"
        >
          Add New Role
          <i class="bx bx-plus"></i>
        </button>
      </div>
      <div class="card">
        <table width="100%">
          <thead>
            <tr>
              <th>ID</th>
              <th>ROLE</th>
              <th>ACTIONS</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let role of role">
              <td>{{ role.id }}</td>
              <td>
                <div class="client">
                  <div class="client-info">
                    <h4>{{ role.roleName }}</h4>
                  </div>
                </div>
              </td>
              <td>
                <div class="actions">
                  <i
                    class="bx bx-edit"
                    mat-button
                    color="primary"
                    (click)="openEditRole(role)"
                  ></i>
                  <i class="bx bxs-trash-alt" (click)="deleterole(role.id)"></i>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="records table-responsive">
        <div class="record-header">
          <p>Users Liste</p>
          <div class="browse">
            <div class="end-header">
              <input
                placeholder="Search..."
                type="text"
                name="text"
                class="input"
              />
              <select name="" id="">
                <option value="">Select Role</option>
              </select>
              <button
                class="Btn"
                mat-button
                color="primary"
                (click)="openCreate()"
              >
                Add New User
                <i class="bx bx-plus"></i>
              </button>
            </div>
          </div>
        </div>
        <div class="card">
          <table width="100%">
            <thead>
              <tr>
                <th><span class="las la-sort"></span> ID</th>
                <th><span class="las la-sort"></span> USERNAME</th>
                <th><span class="las la-sort"></span> EMAIL</th>
                <th><span class="las la-sort"></span> ROLE</th>
                <th><span class="las la-sort"></span> ACTIONS</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let user of users">
                <td>{{ user.id }}</td>
                <td>{{ user.username }}</td>
                <td>{{ user.email }}</td>
                <td>{{ user.roleName }}</td>
                <td>
                  <div class="actions">
                    <i
                      class="bx bx-edit"
                      mat-button
                      color="primary"
                      (click)="openEditDialog(user)"
                    ></i>
                    <i
                      class="bx bxs-trash-alt"
                      (click)="deleteUser(user.id)"
                    ></i>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>
