<app-sidebar></app-sidebar>
<div class="table">
  <div class="header-content">
    <p>Users Liste</p>
    <div class="end-header">
    <input placeholder="Searth..." type="text" name="text" class="input-search">
    <button class="Btn" mat-button  color="primary" (click)="openCreate()">
      
      Add New User
      <i class="bx bx-plus"></i>
    </button>
  </div>
  </div>
  <div class="table-section">
    <table>
      <thead class="table-header">
        <tr>
          <th>ID</th>
          <th>Username</th>
          <th>Email</th>
          <th>Password</th>
          <th>Role</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody class="table-body">
        <tr *ngFor="let user of user">
          <td>{{ user.id }}</td>
          <td>{{ user.username }}</td>
          <td>{{ user.email }}</td>
          <td>{{ user.password }}</td>
          <td>{{ user.roleName }}</td>
         

         
          <td class="btn-action">
            <i class="bx bx-edit" mat-button  color="primary" (click)="openEditDialog(user)"></i>
            <i class="bx bxs-trash-alt"  (click)="deleteUser(user.id)"></i>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
