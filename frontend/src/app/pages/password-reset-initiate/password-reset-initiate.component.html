<div clas="body">
  <div class="resetinitiateContainer">
    <div class="wrapper">
      <span class="bg-animate"></span>
      <span class="bg-animate2"></span>
      <div class="form-box forgetPassword">
        <h2>Password Reset</h2>
        <p>
          To reset your password, enter the email address you use to sign in to
          COFICAB
        </p>
        <form (ngSubmit)="sendEmailVerification()">
          <div class="input-box">
            <input type="email" required [(ngModel)]="email" name="email" />
            <label>Email</label>
            <i class="bx bxs-envelope"></i>
          </div>
          <div class="btn-login-forgetPassword">
            <button
              type="submit"
              class="btn btn-primary"
              data-bs-toggle="modal"
              data-bs-target="#staticBackdrop"
            >
              Send Reset Instructions
            </button>
          </div>
          <div class="logreg-link">
            <p>
              Nevermind! Take me Back to
              <a routerLink="/login" class="login-link">Login</a>
            </p>
          </div>
        </form>
      </div>
      <div class="info-text forgetPassword">
        <img class="animation" src="./assets/coficab.png" alt="Company Logo" />
        <p class="animation">Welcome Back!</p>
      </div>
    </div>
  </div>
</div>
